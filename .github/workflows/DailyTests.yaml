name: Daily tests

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  run-integration-tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Build the Docker image
        run: docker build -t papers .

      - name: Build small integration ZIMs
        run: |
          mkdir -p output
          docker run --rm -v "$PWD/output:/output" papers papers2zim \
            --source gutenberg \
            --output /output \
            --zim-file /output/gutenberg-integration.zim \
            --zim-name gutenberg_integration_test \
            --zim-title "Gutenberg Test" \
            --zim-desc "One Project Gutenberg book for integration testing" \
            --books 11 \
            --formats html \
            --no-index \
            --overwrite
          docker run --rm -v "$PWD/output:/output" papers papers2zim \
            --source opentextbooks \
            --output /output \
            --zim-file /output/opentextbooks-integration.zim \
            --zim-name opentextbooks_integration_test \
            --zim-title "OTL Test" \
            --zim-desc "One Open Textbook Library book for integration testing" \
            --otl-ids 54 \
            --formats pdf \
            --no-index \
            --overwrite
          docker run --rm -v "$PWD/output:/output" papers papers2zim \
            --source wikisource \
            --languages en \
            --output /output \
            --zim-file /output/wikisource-integration.zim \
            --zim-name wikisource_integration_test \
            --zim-title "Wikisource Test" \
            --zim-desc "One Wikisource book for integration testing" \
            --wikisource-pages %27Tis_Sixty_Years_Since \
            --formats epub \
            --no-index \
            --overwrite

      - name: Run zimcheck
        run: |
          docker run --rm -v "$PWD/output:/output" \
            ghcr.io/openzim/zim-tools:3.8.0 zimcheck /output/gutenberg-integration.zim
          docker run --rm -v "$PWD/output:/output" \
            ghcr.io/openzim/zim-tools:3.8.0 zimcheck /output/opentextbooks-integration.zim
          docker run --rm -v "$PWD/output:/output" \
            ghcr.io/openzim/zim-tools:3.8.0 zimcheck /output/wikisource-integration.zim

      - name: Run integration test suite
        run: |
          docker run --rm \
            -v "$PWD/scraper/tests-integration:/src/scraper/tests-integration:ro" \
            -v "$PWD/output:/output:ro" \
            -e ZIM_DIRECTORY=/output \
            papers \
            bash -c "pip install --no-cache-dir pytest && pytest -v /src/scraper/tests-integration"

      - name: Archive integration ZIMs
        uses: actions/upload-artifact@v7
        with:
          name: integration-zims
          path: output/*.zim
          retention-days: 30
